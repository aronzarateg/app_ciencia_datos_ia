# Automatización opcional: mueve este archivo a .github/workflows/ (ver la guía S3S4_Guia_Quarto_GitHub, paso 13).
on:
  push:
    branches: main
name: Publicar informe Quarto
jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::tidyverse
            any::here
            any::recipes
            any::Boruta
            any::FactoMineR
            any::factoextra
            any::corrplot
            any::uwot
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: analisis/S3S4_parte1.qmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
